name: Build emails
# Renders campaigns/*.json into out/ with scripts/build.mjs (idempotent: only pending
# campaigns are built, state is out/.manifest.json).
#   pull_request: builds in the runner and fails on check errors, unsettled rulesets or
#                 unapproved facets. Nothing is committed.
#   push to main: builds, then commits out/ back to main.
on:
  pull_request:
    paths: ['campaigns/**', 'iterable/**', 'scripts/**']
  push:
    branches: [main]
    paths: ['campaigns/**', 'iterable/**', 'scripts/**']
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false   # queue, so builds on main never overlap
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: infoentropy/emails
          path: emails-tool
          # If the tool repo is private, add a read-only token as the EMAILS_REPO_TOKEN secret.
          token: ${{ secrets.EMAILS_REPO_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/build.mjs
        env:
          EMAILS_DIR: emails-tool
      - name: Commit out/ to main
        if: github.event_name == 'push'
        run: |
          git add out
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git config user.name "email-build[bot]"
          git config user.email "email-build[bot]@users.noreply.github.com"
          git commit -m "Build emails [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
