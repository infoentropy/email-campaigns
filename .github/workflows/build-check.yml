name: Check built emails
# Fails when out/ is stale: a campaign, the facet library or the emails tool changed
# without `node scripts/build.mjs` being run and its output committed.
on:
  pull_request:
    paths: ['campaigns/**', 'iterable/**', 'out/**', 'scripts/**']
  push:
    branches: [main]
    paths: ['campaigns/**', 'iterable/**', 'out/**', 'scripts/**']
concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: infoentropy/emails
          path: emails-tool
          # If the tool repo is private, add a read-only token as the EMAILS_REPO_TOKEN secret.
          token: ${{ secrets.EMAILS_REPO_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/build.mjs --check
        env:
          EMAILS_DIR: emails-tool
